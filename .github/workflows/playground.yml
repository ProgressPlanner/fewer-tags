name: Playground Comment

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: mshick/add-pr-comment@v2
        with:
          message: |
            **Test on Playground**
            [Test this pull request on the Playground](https://playground.wordpress.net/#{"landingPage":"/wp-admin/edit-tags.php?taxonomy=post_tag","features":{"networking":true},"steps":[{"step":"defineWpConfigConsts","consts":{"IS_PLAYGROUND_PREVIEW":true}},{"step":"login","username":"admin","password":"password"},{"step":"installPlugin","pluginData":{"resource":"git:directory","url":"${{ github.server_url }}/${{ github.repository }}","ref":"refs/pull/${{ github.event.pull_request.number }}/head","refType":"refname"},"options":{"activate":true,"targetFolderName":"fewer-tags"}}]}) or [download the zip](${{ github.server_url }}/${{ github.repository }}/archive/${{ github.event.pull_request.head.sha }}.zip)
